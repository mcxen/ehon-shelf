name: release
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  draft-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Check the version
        run: test "$GITHUB_REF_NAME" = "v$(jq -r .version mygo.json)"
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 || \
            gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft --verify-tag \
              --title "$GITHUB_REF_NAME" --notes "原生桌面版（Go + MyGo）。安装包见附件；sample-data.zip 为 3 部示例作品（图像版权归国際日本文化研究センター）。macOS / Windows 版未签名，首次打开见 README。"

  build:
    needs: draft-release
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: macOS, os: macos-latest, platform: "darwin/universal" }
          - { name: Windows, os: ubuntu-latest, platform: "windows/amd64" }
          - { name: Linux, os: ubuntu-latest, platform: "linux/amd64" }
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Install NSIS, for the Windows installer
        if: matrix.name == 'Windows'
        run: sudo apt-get update && sudo apt-get install -y nsis
      - run: go test ./...
        if: matrix.name == 'Linux'
      - run: go tool mygo build -platform "${{ matrix.platform }}"
      - name: Collect
        shell: bash
        run: |
          mkdir -p out
          ls -R build | head -50
          case "${{ matrix.name }}" in
            macOS)
              cp build/*/*.dmg out/
              app=$(ls -d build/*/*.app | head -1)
              ditto -c -k --keepParent "$app" "out/EhonShelf-${GITHUB_REF_NAME#v}-macos-universal.app.zip" ;;
            Windows)
              cp build/*/*Setup*.exe out/
              exe=$(ls build/*/*.exe | grep -v Setup | head -1)
              (cd "$(dirname "$exe")" && zip -j "$GITHUB_WORKSPACE/out/EhonShelf-${GITHUB_REF_NAME#v}-windows-amd64-portable.zip" "$(basename "$exe")") ;;
            Linux)
              cp build/*/*.tar.gz build/*/*.deb build/*/install.sh out/ ;;
          esac
          ls -la out
      - name: Upload to the release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" out/* --repo "$GITHUB_REPOSITORY" --clobber

  publish:
    needs: build
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Carry sample-data.zip forward from an earlier release
        run: |
          if ! gh release view "$GITHUB_REF_NAME" --json assets -q '.assets[].name' | grep -qx sample-data.zip; then
            for t in $(gh release list --limit 30 --json tagName,isDraft -q '.[] | select(.isDraft|not) | .tagName'); do
              if gh release download "$t" -p sample-data.zip -D . 2>/dev/null; then
                echo "sample-data.zip from $t"; gh release upload "$GITHUB_REF_NAME" sample-data.zip --clobber; break
              fi
            done
          fi
      - name: Publish
        run: gh release edit "$GITHUB_REF_NAME" --draft=false --latest
